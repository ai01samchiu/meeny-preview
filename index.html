<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MEENY MINY MOE">
<meta name="theme-color" content="#faf7f5">
<title>MEENY MINY MOE・預覽樣板</title>
<style>
:root{
  --bg:#faf7f5; --card:#ffffff; --ink:#2b2422; --ink2:#5d524e; --muted:#9a8f8a;
  --line:#eee6e2; --soft:#f3ece8; --blush:#e9c9c3; --rose:#c48b84; --rose-d:#a86f69;
  --ok:#7d9b84; --warn:#d49a5a; --danger:#c0564b;
  --r:16px; --font:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:radial-gradient(circle at 20% 20%,#f6e9e5,#ece4e0 60%,#e5dcd8);display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.phone{width:390px;height:844px;border-radius:52px;border:11px solid #1f1b1a;background:var(--bg);overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(60,40,35,.28)}
.side-note{position:fixed;left:24px;bottom:20px;font-size:12px;color:#8d817c;max-width:260px;line-height:1.6}
@media (max-width:520px){
  body{display:block;background:var(--bg)}
  .phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}
  .side-note{display:none}
}
.banner{flex:none;background:var(--ink);color:#f6ebe7;font-size:11px;letter-spacing:.08em;text-align:center;padding:5px 0;padding-top:max(5px,env(safe-area-inset-top))}
.view{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px 24px}
.hdr{flex:none;display:flex;align-items:center;gap:10px;padding:14px 18px 10px;min-height:58px}
.hdr h1{font-size:24px;margin:0;font-weight:700;letter-spacing:.02em;flex:1}
.hdr h2{font-size:17px;margin:0;font-weight:600;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wordmark{font-size:10px;letter-spacing:.32em;color:var(--rose);font-weight:600}
.ibtn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink)}
.ibtn:active{background:var(--soft)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:500}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:44px}
.search input{border:0;outline:0;flex:1;background:none;font-size:15px;min-width:0}
.search svg{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.rose{background:#f7e8e5;border-color:#f0d7d2;color:var(--rose-d)}
.chip .x{margin-left:4px;opacity:.6}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-top:12px}
.seg button{flex:1;padding:7px 0;border-radius:10px;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);text-align:left;display:block;width:100%}
.card .ph{aspect-ratio:3/4;position:relative;background:var(--soft)}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .meta{padding:8px 10px 10px}
.card .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.92);color:var(--ink);font-size:11px;padding:3px 8px;border-radius:999px;font-weight:600}
.badge.r{left:auto;right:8px;background:rgba(43,36,34,.6);color:#fff;font-weight:500}
.badge.draft{background:#fff3e3;color:#a26a2a}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{width:84px;height:84px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--rose)}
.empty .big svg{width:34px;height:34px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.empty p{font-size:13px;margin:0 0 18px;line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:48px;border-radius:14px;padding:0 18px;font-size:15px;font-weight:600}
.btn.pri{background:var(--ink);color:#fff}
.btn.pri:active{opacity:.85}
.btn.sec{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:#fbeceb;color:var(--danger)}
.btn.block{width:100%}
.btn.sm{height:36px;font-size:13px;border-radius:11px;padding:0 12px}
.tabbar{flex:none;display:flex;align-items:flex-end;justify-content:space-around;background:rgba(255,255,255,.94);border-top:1px solid var(--line);padding:6px 6px max(10px,env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px 0}
.tab.on{color:var(--ink);font-weight:600}
.tab svg.i{width:23px;height:23px}
.fab{width:54px;height:54px;border-radius:18px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 8px 20px rgba(43,36,34,.3)}
.fab svg.i{width:26px;height:26px;stroke-width:2}
.tip{background:#f7ebe8;border-radius:14px;padding:12px 14px;font-size:12.5px;color:var(--rose-d);display:flex;gap:10px;align-items:flex-start;margin-top:12px;line-height:1.55}
.tip svg{flex:none;margin-top:1px}
.tip .close{margin-left:auto;color:var(--rose-d);opacity:.7}
.login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 30px 50px}
.logo{width:76px;height:76px;border-radius:24px;background:linear-gradient(135deg,#f3d9d3,#d9a59d);display:flex;align-items:center;justify-content:center;margin-bottom:22px;box-shadow:0 10px 30px rgba(196,139,132,.35)}
.login h1{font-size:26px;letter-spacing:.14em;margin:0 0 6px;font-weight:700}
.login .sub{color:var(--muted);font-size:14px;margin-bottom:32px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px;font-weight:500}
.fld label .opt{color:var(--muted);font-weight:400}
.inp{width:100%;height:48px;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:0 14px;font-size:16px;outline:0}
.inp:focus{border-color:var(--ink)}
textarea.inp{height:auto;min-height:84px;padding:12px 14px;resize:none;line-height:1.5}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat}
.pwd{position:relative}.pwd button{position:absolute;right:6px;top:4px;color:var(--muted)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:4px 0 8px}
.link{color:var(--rose-d);font-size:13px;font-weight:500}
.fine{font-size:12px;color:var(--muted);text-align:center;margin-top:26px;line-height:1.7}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:20px;margin-top:4px}
.car::-webkit-scrollbar{display:none}
.car img{flex:none;width:100%;aspect-ratio:4/5;object-fit:cover;scroll-snap-align:center;display:block}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.dots i{width:6px;height:6px;border-radius:50%;background:#dcd2ce;transition:width .2s}
.dots i.on{background:var(--ink);width:16px;border-radius:3px}
.dt{font-size:22px;font-weight:700;margin:12px 0 10px}
.kv{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px}
.kv .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv .row:last-child{border-bottom:0}
.kv .row span:first-child{color:var(--muted);flex:none}
.kv .row span:last-child{text-align:right}
.sec-t{font-size:13px;font-weight:600;color:var(--ink2);margin:22px 0 10px;letter-spacing:.05em;display:flex;align-items:center;justify-content:space-between}
.step{display:flex;gap:12px;padding-bottom:16px;position:relative}
.step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--blush);color:var(--rose-d);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.steps .step:not(:last-child)::before{content:"";position:absolute;left:12.5px;top:26px;bottom:0;width:1px;background:var(--line)}
.step .b{flex:1;min-width:0}
.step .a{font-size:15px;font-weight:600;margin-top:3px}
.step .note{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mchip{font-size:12px;background:var(--soft);border-radius:8px;padding:4px 8px;color:var(--ink2)}
.notebox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;font-size:14px;line-height:1.65;white-space:pre-wrap}
.actions{display:flex;gap:10px;margin-top:22px}
.actions .btn{flex:1}
.stepper{display:flex;align-items:center;padding:4px 26px 14px}
.stepper .s{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.stepper .s i{width:26px;height:26px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:600}
.stepper .s.on{color:var(--ink);font-weight:600}.stepper .s.on i{background:var(--ink);color:#fff}
.stepper .s.done i{background:var(--blush);color:var(--rose-d)}
.stepper .ln{flex:1;height:1px;background:var(--line);margin:0 8px 16px}
.stepper .ln.done{background:var(--blush)}
.copy-link{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ink2)}
.copy-link svg{width:15px;height:15px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.slot{aspect-ratio:3/4;border-radius:14px;border:1.5px dashed #dccfca;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:11px;gap:4px;position:relative;overflow:hidden;width:100%}
.slot.cover{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot.filled{border:0}
.slot .tag{position:absolute;left:6px;top:6px;background:var(--ink);color:#fff;font-size:10px;padding:2px 7px;border-radius:999px;z-index:1}
.slot .num{position:absolute;right:6px;bottom:6px;background:rgba(255,255,255,.9);color:var(--ink);font-size:10px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:1}
.hint{font-size:12px;color:var(--muted);line-height:1.7;margin-top:12px}
.botbar{flex:none;display:flex;gap:8px;padding:10px 16px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.botbar .btn{flex:1;padding:0 10px}
.botbar .btn.ic{flex:none;width:48px;padding:0}
.picker{display:flex;align-items:center;justify-content:space-between;width:100%;height:48px;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:0 14px;font-size:16px;text-align:left}
.picker .ph{color:var(--muted)}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:8px 10px;min-height:48px}
.tagbox input{border:0;outline:0;flex:1;min-width:90px;font-size:16px;background:none;height:30px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sugg .chip{font-size:12px;padding:4px 10px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;gap:10px;margin-bottom:10px}
.scard .ops{display:flex;flex-direction:column;gap:2px}
.scard .ops .ibtn{width:30px;height:30px;color:var(--muted)}
.scard .ops svg.i{width:17px;height:17px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-size:15px}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .sub{font-size:12px;color:var(--muted);margin-top:2px}
.li .chev{color:#cbbfba}
.av{width:40px;height:40px;border-radius:50%;background:var(--blush);color:var(--rose-d);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.cat-h{font-size:12px;color:var(--muted);margin:18px 2px 8px;display:flex;justify-content:space-between;letter-spacing:.05em}
.sw{width:36px;height:36px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.ccard{text-align:left}
.mosaic{aspect-ratio:1;border-radius:18px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:var(--soft)}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block}
.mosaic.one img{grid-column:span 2;grid-row:span 2}
.ccard .t{font-size:15px;font-weight:600;margin-top:8px}.ccard .s{font-size:12px;color:var(--muted)}
.prof{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.prof .av{width:54px;height:54px;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 0}
.stats div{text-align:center;font-size:11px;color:var(--muted)}
.stats b{display:block;font-size:19px;color:var(--ink);margin-bottom:2px}
.bar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blush),var(--rose));border-radius:5px}
.bar.warn i{background:linear-gradient(90deg,#f0c99b,var(--warn))}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.box .h{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:600}
.box .h small{font-weight:400;color:var(--muted);font-size:12px}
.small{font-size:12px;color:var(--muted);line-height:1.6}
.scrim{position:absolute;inset:0;background:rgba(30,22,20,.38);z-index:40;display:flex;align-items:flex-end;animation:fade .18s}
.sheet{background:var(--bg);width:100%;max-height:88%;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
.sheet .sh-h{display:flex;align-items:center;padding:8px 10px 6px 20px;font-weight:600;font-size:17px}
.sheet .sh-h span{flex:1}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:#ddd2ce;margin:8px auto 0}
.sheet .sh-b{overflow-y:auto;padding:6px 20px 14px;flex:1;min-height:0}
.sheet .sh-f{display:flex;gap:10px;padding:10px 20px max(16px,env(safe-area-inset-bottom))}
.sheet .sh-f .btn{flex:1}
.menu .li{font-size:16px}
.menu .li.danger{color:var(--danger)}
.ac{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-top:6px;overflow:hidden;max-height:210px;overflow-y:auto}
.ac button{display:flex;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px;gap:8px;align-items:center}
.ac button:last-child{border-bottom:0}
.ac .cat{font-size:11px;color:var(--muted);margin-left:auto;flex:none}
.ac .new{color:var(--rose-d);font-weight:500}
.ck{width:22px;height:22px;border-radius:7px;border:1.5px solid #d6cbc6;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.ck.on{background:var(--ink);border-color:var(--ink)}
.ck svg.i{width:14px;height:14px;stroke-width:2.5}
.toast{pointer-events:none;position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(43,36,34,.94);color:#fff;font-size:13.5px;padding:10px 16px;border-radius:12px;z-index:60;max-width:85%;text-align:center;animation:fade .2s;line-height:1.5}
@keyframes up{from{transform:translateY(40%);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hide{display:none!important}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="banner">預覽樣板・未連雲端</div>
  <div class="view" id="app"></div>
  <div id="sheet"></div>
  <div id="toast"></div>
  <input type="file" id="file" accept="image/*" multiple class="hide">
</div>
<div class="side-note">MEENY MINY MOE 預覽樣板<br>所有資料只存喺記憶體，重新整理就會還原。<br>喺 iPhone 打開會自動全螢幕。</div>
<script>
"use strict";
/* ========== 小工具 ========== */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let _id = 100; const uid = p => p + (++_id);
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const fmtDate = s => { if(!s) return "—"; const [y,m,d] = s.split("-"); return y + "年" + (+m) + "月" + (+d) + "日"; };
const MAX_PHOTOS = 5, CAP_WORKS = 570, PHOTO_MB = 0.34;

const P = {
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  grid:'<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',
  folder:'<path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .7 3 2.8 3 6"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  back:'<path d="m15 18-6-6 6-6"/>', chev:'<path d="m9 18 6-6-6-6"/>',

const PAL = [

  ["#1f2340","#3b2a5c",["#5a3f8c","#1b1f3a"],"cat"],

const _svgCache = {};
function photoSrc(p){
  if (p.src) return p.src;
  const k = p.seed % PAL.length;
  if (_svgCache[k]) return _svgCache[k];
  const [b1,b2,[n1,n2],style] = PAL[k];
  const xs=[52,103,152,201,249], ys=[200,150,132,150,198], rot=[-14,-6,0,6,14];
  let nails = "";
  for (let i=0;i<5;i++){
    const w = i===0?38:44, h = i===0?66:80, x = xs[i]-w/2, y = ys[i];
    let deco = "";
    if (style==="french") deco = '<path d="M'+x+' '+(y+20)+'q'+(w/2)+' -14 '+w+' 0v-6q0 -14 -'+(w/2)+' -14t-'+(w/2)+' 14z" fill="#fffaf7" opacity=".95"/>';
    if (style==="cat") deco = '<rect x="'+(x+w*0.38)+'" y="'+(y+6)+'" width="'+(w*0.2)+'" height="'+(h-14)+'" rx="4" fill="#d9cfff" opacity=".7"/>';
    if (style==="pearl") deco = '<circle cx="'+(x+w/2)+'" cy="'+(y+h*0.62)+'" r="5" fill="#fff" stroke="#e3d6cc"/><circle cx="'+(x+w/2-9)+'" cy="'+(y+h*0.78)+'" r="3" fill="#fff" stroke="#e3d6cc"/><circle cx="'+(x+w/2+9)+'" cy="'+(y+h*0.78)+'" r="3" fill="#fff" stroke="#e3d6cc"/>';
    if (style==="flower" && i%2===0) deco = '<g transform="translate('+(x+w/2)+' '+(y+h*0.5)+')" fill="#fff">'+[0,72,144,216,288].map(a=>'<ellipse rx="4" ry="8" transform="rotate('+a+') translate(0 -7)"/>').join("")+'<circle r="3.5" fill="#f2c14e"/></g>';
    if (style==="dots") deco = '<circle cx="'+(x+w*0.35)+'" cy="'+(y+h*0.45)+'" r="3.2" fill="#111"/><circle cx="'+(x+w*0.65)+'" cy="'+(y+h*0.45)+'" r="3.2" fill="#111"/><path d="M'+(x+w*0.3)+' '+(y+h*0.65)+'q'+(w*0.2)+' 8 '+(w*0.4)+' 0" stroke="#111" stroke-width="2.5" fill="none"/>';
    if (style==="jelly") deco = '<rect x="'+(x+6)+'" y="'+(y+8)+'" width="6" height="'+(h*0.5)+'" rx="3" fill="#fff" opacity=".7"/>';
    nails += '<g transform="rotate('+rot[i]+' '+xs[i]+' '+(y+h)+')"><rect x="'+(x-5)+'" y="'+(y+h-24)+'" width="'+(w+10)+'" height="240" rx="'+(w/2+5)+'" fill="#f1d3c2"/><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(w/2)+'" fill="url(#n)" '+(style==="jelly"?'opacity=".75"':'')+'/>'+deco+'<rect x="'+(x+w*0.18)+'" y="'+(y+6)+'" width="'+(w*0.14)+'" height="'+(h*0.35)+'" rx="3" fill="#fff" opacity=".35"/></g>';
  }
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+b1+'"/><stop offset="1" stop-color="'+b2+'"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+n1+'"/><stop offset="1" stop-color="'+n2+'"/></linearGradient></defs><rect width="300" height="400" fill="url(#b)"/><circle cx="250" cy="60" r="70" fill="#fff" opacity=".18"/>'+nails+'</svg>';
  return (_svgCache[k] = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg));
}

  if (!ph.length) return '<div class="mosaic one" style="display:flex;align-items:center;justify-content:center;color:var(--rose)">'+ic("folder")+'</div>';
  if (ph.length<4) return '<div class="mosaic one"><img alt="" src="'+photoSrc(ph[0].photos[0])+'"></div>';
  return '<div class="mosaic">'+ph.map(w=>'<img alt="" src="'+photoSrc(w.photos[0])+'">').join("")+'</div>';
}

function swatch(m){ const h = Array.from(m.brand+m.name).reduce((a,c)=>a+c.charCodeAt(0),0)%360; return 'linear-gradient(135deg,hsl('+h+' 45% 82%),hsl('+((h+30)%360)+' 40% 68%))'; }
function matsListHTML(){
  const q = S.matQ.trim().toLowerCase();
  let list = S.materials.filter(m => !q || [m.brand,m.name,m.note,catName(m.catId),m.colors.join(" ")].join(" ").toLowerCase().includes(q));
  if (!S.materials.length) return emptyBox("box","還未有材料","材料庫由你自己建立：加入常用嘅色膠、飾物同工具，記錄步驟時就可以快速揀。",'<button class="btn pri" data-a="matForm">'+ic("plus")+' 新增材料</button>');
  if (S.matF==="recent"){ list = list.slice().sort((a,b)=>b.created.localeCompare(a.created)).slice(0,10); }
  else if (S.matF!=="all") list = list.filter(m => (m.catId||"") === S.matF);
  if (!list.length) return emptyBox("search","搵唔到材料","試下其他關鍵字，或者新增呢樣材料。");
  const row = m => '<button class="li" data-a="matForm" data-id="'+m.id+'"><div class="sw" style="background:'+swatch(m)+'">'+ic("box","","width:16px;height:16px")+'</div><div class="grow"><div><b style="font-weight:600">'+esc(m.brand)+'</b> '+esc(m.name)+'</div><div class="sub">'+(m.colors.length?esc(m.colors.join("、")):'冇色號')+'・用過 '+m.use+' 次</div></div>'+ic("chev","chev")+'</button>';
  if (S.matF==="recent") return '<div class="cat-h"><span>最近新增</span></div><div class="list">'+list.map(row).join("")+'</div>';
  const groups = {}; list.forEach(m => (groups[m.catId||""] = groups[m.catId||""] || []).push(m));
  const order = S.categories.map(c=>c.id).concat([""]);
  return order.filter(k=>groups[k]).map(k=>'<div class="cat-h"><span>'+esc(catName(k))+'</span><span>'+groups[k].length+'</span></div><div class="list">'+groups[k].sort((a,b)=>b.use-a.use).map(row).join("")+'</div>').join("");
}

function acHTML(s){
  const q = (s.mq||"").trim().toLowerCase();
  const opts = [];
  S.materials.slice().sort((a,b)=>b.use-a.use).forEach(m => {
    const variants = m.colors.length ? m.colors : [""];
    variants.forEach(c => { const label = m.brand+" "+m.name+" "+c+" "+catName(m.catId); if (!q || label.toLowerCase().includes(q)) opts.push({m:m.id,c,cat:catName(m.catId)}); });
  });
  const shown = (q ? opts.slice(0,8) : opts.slice(0,5)).filter(o=>!s.mats.some(r=>r.m===o.m&&r.c===o.c));
  if (!q && !S.materials.length) return '<div class="small" style="margin-top:6px">材料庫仲係空，輸入名稱就可以即時加入。</div>';
  if (!q && !shown.length) return '';
  return '<div class="ac">'+(q?'':'<div class="small" style="padding:8px 12px 2px">常用</div>')+shown.map(o=>'<button data-a="stPickMat" data-m="'+o.m+'" data-c="'+esc(o.c)+'">'+ic("box")+'<span>'+esc(matLabel(o))+'</span><span class="cat">'+esc(o.cat)+'</span></button>').join("")+
    (q?'<button class="new" data-a="stNewMat">'+ic("plus")+'加「'+esc(s.mq.trim())+'」入材料庫</button>':'')+'</div>';
}

function renderSheet(){
  const host = $("#sheet"), s = S.sheet;
  if (!s){ host.innerHTML=""; return; }
  const r = SH[s.type](s);
  host.innerHTML = '<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-label="'+esc(r.title||"")+'"><div class="grab"></div><div class="sh-h"><span>'+esc(r.title||"")+'</span><button class="ibtn" data-a="closeSheet" aria-label="關閉">'+ic("x")+'</button></div><div class="sh-b">'+r.body+'</div>'+(r.foot?'<div class="sh-f">'+r.foot+'</div>':'')+'</div></div>';
  if (r.focus){ const f = $(r.focus, host); if (f) f.focus(); }
}

  const data = {catId:s.catId, brand:s.brand.trim(), name:s.name.trim(), colors:s.colors, note:s.note.trim()};
  if (s.id) Object.assign(byId(S.materials,s.id), data); else S.materials.push(Object.assign({id:uid("m"), created:today(), use:0}, data));
  closeSheet(); render(); toast(s.id?"已儲存材料":"已新增材料"); };
A.matDel = () => { const id = S.sheet.id; const n = S.works.filter(w=>w.steps.some(st=>st.mats.some(r=>r.m===id))).length;
  confirmSheet("刪除材料？", n?"有 "+n+" 件作品嘅步驟用咗呢樣材料，刪除後會喺嗰啲步驟移除。":"刪除後無法復原。","刪除",()=>{ S.materials=S.materials.filter(m=>m.id!==id); S.works.forEach(w=>w.steps.forEach(st=>{st.mats=st.mats.filter(r=>r.m!==id);})); render(); toast("已刪除材料"); },true); };
A.cats = () => openSheet({type:"cats"});
A.catAdd = () => { const v=$("#catNew").value.trim(); if(!v) return; S.categories.push({id:uid("c"),name:v}); render(); renderSheet(); const n=$("#catNew"); if (n) n.focus(); };
A.catMove = el => { const i=+el.dataset.i; if(!i) return; const a=S.categories; const t=a[i-1]; a[i-1]=a[i]; a[i]=t; render(); };
A.catRename = el => { const c=byId(S.categories, el.dataset.id); textSheet({title:"改分類名稱",label:"分類名稱",val:c.name,fn:v=>{c.name=v; render(); openSheet({type:"cats"});}}); };
A.catDel = el => { const id=el.dataset.id; S.categories=S.categories.filter(c=>c.id!==id); S.materials.forEach(m=>{if(m.catId===id) m.catId="";}); if (S.matF===id) S.matF="all"; render(); toast("已刪除分類"); };

/* 設定 */
A.export = () => {
  const data = {exported_at:new Date().toISOString(), note:"預覽樣板匯出（示範資料，正式版會連相片 zip）", works:S.works.map(w=>Object.assign({},w,{photos:w.photos.map((p,i)=>({sort_order:i, storage_path:"works/"+w.id+"/"+(p.id||i)+".jpg"}))})), collections:S.collections, clients:S.clients, materials:S.materials, categories:S.categories};
  try { if (window.Blob && window.URL && URL.createObjectURL) { const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="meeny-miny-moe-backup-"+today()+".json"; document.body.appendChild(a); a.click(); a.remove(); } } catch(_){}
  S.lastBackup = today(); render(); toast("已匯出備份（正式版會連相片 zip）"); };
A.changePwd = () => toast("正式版：輸入舊密碼同新密碼即可更改");
A.logout = () => confirmSheet("登出？","登出之後要再輸入電郵同密碼先可以入。","登出",()=>{ S.authed=false; S.stack=[]; S.sheet=null; render(); });
A.clearDemo = () => confirmSheet("清空示範資料？","會清走所有作品、選集、客人、材料同分類，方便睇空白畫面（重新整理會還原）。","清空",()=>{ Object.assign(S,{works:[],collections:[],clients:[],materials:[],categories:[],fTag:"",q:"",matF:"all"}); render(); toast("已清空"); },true);
A.resetDemo = () => { Object.assign(S, sampleData(), {fTag:"",q:"",fStatus:"all",matF:"all"}); render(); toast("已還原示範資料"); };

/* 輸入事件 */
const IN = {};
IN.q = el => { S.q = el.value; $("#grid").innerHTML = gridHTML(); $("#clearQ").classList.toggle("hide", !S.q); };
IN.cliQ = el => { S.cliQ = el.value; $("#cliList").innerHTML = clientsListHTML(); };
IN.matQ = el => { S.matQ = el.value; $("#matList").innerHTML = matsListHTML(); };
IN.ed = el => { S.ed[el.dataset.f] = el.value; };
IN.sh = el => { S.sheet[el.dataset.f] = el.value; };
IN.stMq = el => { S.sheet.mq = el.value; $("#ac").innerHTML = acHTML(S.sheet); };
IN.cpq = el => { S.sheet.q = el.value; $("#cpList").innerHTML = clientPickList(el.value.trim()); };

/* 相片壓縮（示範：真正揀相會縮到長邊 1600px，轉 JPEG，同時去走 EXIF） */
function compress(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const MAX=1600, k=Math.min(1, MAX/Math.max(img.naturalWidth, img.naturalHeight));
      const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",0.82)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("load")); };
    img.src = url;
  });
}

/* ========== 事件綁定 ========== */
const phone = $("#phone");
phone.addEventListener("click", ev => { const t = ev.target.closest("[data-a]"); if (!t || t.disabled) return; const fn = A[t.dataset.a]; if (fn) fn(t, ev); });
phone.addEventListener("input", ev => { const t = ev.target; if (t.dataset && t.dataset.in && IN[t.dataset.in]) IN[t.dataset.in](t); });
phone.addEventListener("change", ev => { const t = ev.target; if (t.tagName==="SELECT" && t.dataset.in && IN[t.dataset.in]) IN[t.dataset.in](t); });
phone.addEventListener("keydown", ev => { const t = ev.target;
  if (ev.isComposing) return;
  if (t.dataset && t.dataset.enter && (ev.key==="Enter" || (ev.key==="," && t.id==="tagIn"))) { ev.preventDefault(); A[t.dataset.enter](t); return; }
  if (t.id==="lgPwd" && ev.key==="Enter") A.login();
  if (t.id==="stMq" && ev.key==="Enter") { ev.preventDefault(); const first = $("#ac .ac button"); if (first) first.click(); } });
phone.addEventListener("scroll", ev => { const t = ev.target; if (t.id==="car"){ const i = Math.round(t.scrollLeft / t.clientWidth); document.querySelectorAll("#dots i").forEach((d,k)=>d.classList.toggle("on",k===i)); } }, true);
$("#file").addEventListener("change", async ev => {
  const files = Array.from(ev.target.files || []); if (!S.ed) return;
  const room = MAX_PHOTOS - S.ed.photos.length;
  if (files.length > room) toast("每件作品最多 5 張，只加咗頭 "+room+" 張");
  for (const f of files.slice(0, room)) { try { S.ed.photos.push({id:uid("p"), src: await compress(f)}); } catch(_) { toast("有張相讀唔到"); } }
  render();
});
render();
</script>
